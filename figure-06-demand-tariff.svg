<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="470" fill="#ffffff"/>

  <!-- ================= PANEL 1: MONTHS ================= -->
  <text x="40" y="42" font-size="13.5" font-weight="700" fill="#1c2126">1 &#183; Months in which the demand window applies</text>
  <text x="40" y="62" font-size="11.5" fill="#4a555f">November to March, and June to August</text>

  <g font-size="12">
    <!-- 12 month cells, 68px wide -->
    <!-- Jan F M A M J J A S O N D -->
    <rect x="40"  y="78" width="68" height="46" fill="#f7dfd0" stroke="#c1846a"/>
    <rect x="108" y="78" width="68" height="46" fill="#f7dfd0" stroke="#c1846a"/>
    <rect x="176" y="78" width="68" height="46" fill="#f7dfd0" stroke="#c1846a"/>
    <rect x="244" y="78" width="68" height="46" fill="#f6f8f9" stroke="#d3dade"/>
    <rect x="312" y="78" width="68" height="46" fill="#f6f8f9" stroke="#d3dade"/>
    <rect x="380" y="78" width="68" height="46" fill="#dde7f2" stroke="#7d9dc0"/>
    <rect x="448" y="78" width="68" height="46" fill="#dde7f2" stroke="#7d9dc0"/>
    <rect x="516" y="78" width="68" height="46" fill="#dde7f2" stroke="#7d9dc0"/>
    <rect x="584" y="78" width="68" height="46" fill="#f6f8f9" stroke="#d3dade"/>
    <rect x="652" y="78" width="68" height="46" fill="#f6f8f9" stroke="#d3dade"/>
    <rect x="720" y="78" width="68" height="46" fill="#f7dfd0" stroke="#c1846a"/>
    <rect x="788" y="78" width="68" height="46" fill="#f7dfd0" stroke="#c1846a"/>

    <text x="74"  y="100" text-anchor="middle" font-weight="600" fill="#1c2126">Jan</text>
    <text x="142" y="100" text-anchor="middle" font-weight="600" fill="#1c2126">Feb</text>
    <text x="210" y="100" text-anchor="middle" font-weight="600" fill="#1c2126">Mar</text>
    <text x="278" y="100" text-anchor="middle" fill="#98a2aa">Apr</text>
    <text x="346" y="100" text-anchor="middle" fill="#98a2aa">May</text>
    <text x="414" y="100" text-anchor="middle" font-weight="600" fill="#1c2126">Jun</text>
    <text x="482" y="100" text-anchor="middle" font-weight="600" fill="#1c2126">Jul</text>
    <text x="550" y="100" text-anchor="middle" font-weight="600" fill="#1c2126">Aug</text>
    <text x="618" y="100" text-anchor="middle" fill="#98a2aa">Sep</text>
    <text x="686" y="100" text-anchor="middle" fill="#98a2aa">Oct</text>
    <text x="754" y="100" text-anchor="middle" font-weight="600" fill="#1c2126">Nov</text>
    <text x="822" y="100" text-anchor="middle" font-weight="600" fill="#1c2126">Dec</text>

    <text x="210" y="117" text-anchor="middle" font-size="9.5" fill="#8d5a3f">SUMMER</text>
    <text x="74"  y="117" text-anchor="middle" font-size="9.5" fill="#8d5a3f">SUMMER</text>
    <text x="142" y="117" text-anchor="middle" font-size="9.5" fill="#8d5a3f">SUMMER</text>
    <text x="754" y="117" text-anchor="middle" font-size="9.5" fill="#8d5a3f">SUMMER</text>
    <text x="822" y="117" text-anchor="middle" font-size="9.5" fill="#8d5a3f">SUMMER</text>
    <text x="414" y="117" text-anchor="middle" font-size="9.5" fill="#41638c">WINTER</text>
    <text x="482" y="117" text-anchor="middle" font-size="9.5" fill="#41638c">WINTER</text>
    <text x="550" y="117" text-anchor="middle" font-size="9.5" fill="#41638c">WINTER</text>
    <text x="278" y="117" text-anchor="middle" font-size="9.5" fill="#aab3ba">none</text>
    <text x="346" y="117" text-anchor="middle" font-size="9.5" fill="#aab3ba">none</text>
    <text x="618" y="117" text-anchor="middle" font-size="9.5" fill="#aab3ba">none</text>
    <text x="686" y="117" text-anchor="middle" font-size="9.5" fill="#aab3ba">none</text>
  </g>

  <!-- ================= PANEL 2: DAILY WINDOW ================= -->
  <text x="40" y="176" font-size="13.5" font-weight="700" fill="#1c2126">2 &#183; The daily window within those months</text>
  <text x="40" y="196" font-size="11.5" fill="#4a555f">15:00 to 21:00 local time</text>

  <!-- 24h bar: x from 40 to 856, 816px = 24h, 34px/hour -->
  <rect x="40" y="212" width="816" height="48" fill="#f6f8f9" stroke="#d3dade"/>
  <rect x="550" y="212" width="204" height="48" fill="#f9e2e2" stroke="#c06a6a" stroke-width="1.6"/>
  <text x="652" y="234" font-size="12.5" font-weight="700" fill="#933b3b" text-anchor="middle">DEMAND WINDOW</text>
  <text x="652" y="251" font-size="11" fill="#933b3b" text-anchor="middle">15:00 &#8211; 21:00</text>

  <!-- hour ticks every 3h -->
  <g font-size="10" fill="#7a858e">
    <line x1="40"  y1="260" x2="40"  y2="268" stroke="#b8c1c7"/><text x="40"  y="282" text-anchor="middle">00</text>
    <line x1="142" y1="260" x2="142" y2="268" stroke="#b8c1c7"/><text x="142" y="282" text-anchor="middle">03</text>
    <line x1="244" y1="260" x2="244" y2="268" stroke="#b8c1c7"/><text x="244" y="282" text-anchor="middle">06</text>
    <line x1="346" y1="260" x2="346" y2="268" stroke="#b8c1c7"/><text x="346" y="282" text-anchor="middle">09</text>
    <line x1="448" y1="260" x2="448" y2="268" stroke="#b8c1c7"/><text x="448" y="282" text-anchor="middle">12</text>
    <line x1="550" y1="260" x2="550" y2="272" stroke="#c06a6a" stroke-width="1.5"/><text x="550" y="286" text-anchor="middle" fill="#933b3b" font-weight="600">15</text>
    <line x1="652" y1="260" x2="652" y2="268" stroke="#b8c1c7"/><text x="652" y="282" text-anchor="middle">18</text>
    <line x1="754" y1="260" x2="754" y2="272" stroke="#c06a6a" stroke-width="1.5"/><text x="754" y="286" text-anchor="middle" fill="#933b3b" font-weight="600">21</text>
    <line x1="856" y1="260" x2="856" y2="268" stroke="#b8c1c7"/><text x="856" y="282" text-anchor="middle">24</text>
  </g>

  <!-- ================= PANEL 3: HOW CHARGED / WORKAROUND ================= -->
  <text x="40" y="332" font-size="13.5" font-weight="700" fill="#1c2126">3 &#183; How the charge is calculated, and how the system avoids it</text>

  <rect x="40" y="348" width="392" height="100" rx="6" fill="#f6f8f9" stroke="#d3dade"/>
  <text x="60" y="371" font-size="12" font-weight="600" fill="#1c2126">Ausgrid&#8217;s charge</text>
  <text x="60" y="392" font-size="11" fill="#4a555f">The single highest 30-minute import reading</text>
  <text x="60" y="409" font-size="11" fill="#4a555f">in the month, within the window, multiplied by</text>
  <text x="60" y="426" font-size="11" fill="#4a555f">the demand rate and the days in the month.</text>
  <text x="60" y="443" font-size="10.5" fill="#933b3b" font-style="italic">One careless half hour sets the whole month.</text>

  <rect x="464" y="348" width="456" height="100" rx="6" fill="#e6f2ee" stroke="#0b6e4f"/>
  <text x="484" y="371" font-size="12" font-weight="600" fill="#0b6e4f">The workaround in this system</text>
  <text x="484" y="392" font-size="11" fill="#31463f">Inside the window, any forecast import price below</text>
  <text x="484" y="409" font-size="11" fill="#31463f">$1.00/kWh is rewritten to $1.00/kWh before the</text>
  <text x="484" y="426" font-size="11" fill="#31463f">MPC POST. The optimiser then avoids grid import</text>
  <text x="484" y="443" font-size="11" fill="#31463f">as ordinary economics. Genuine spikes pass through.</text>
</svg>
